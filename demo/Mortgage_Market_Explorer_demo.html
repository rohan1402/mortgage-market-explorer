<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mortgage Market Explorer - screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F5F4}
.tab{color:#56636B;text-decoration:none;padding:10px 12px;border-radius:8px;font-size:15px;font-weight:500;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center}
.tab:hover{color:#142026;background:#F3F5F4}
.pick{text-decoration:none;color:#142026}
.pick:hover{border-color:#142026 !important;color:#142026}
.go{text-decoration:none}
.go:hover{text-decoration:underline}
a{color:#2F6E80}
a:hover{color:#142026}
.chip{cursor:pointer;transition:background .15s,color .15s}
.chip:hover{border-color:#142026 !important}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2F6E80;outline-offset:2px}
.seg{cursor:pointer}
.seg:hover{border-color:#142026 !important}
.cty{cursor:pointer;stroke:#FFFFFF;stroke-width:1.2;stroke-linejoin:round;transition:fill .3s,opacity .3s}
.dim{opacity:.32}
.pinline{fill:none;stroke:#142026;stroke-width:2.4;stroke-linejoin:round;pointer-events:none}
.glow{fill:#E8A23A;fill-opacity:.22;stroke:#E8A23A;stroke-width:3;stroke-linejoin:round;pointer-events:none;filter:drop-shadow(0 0 4px rgba(232,162,58,.95)) drop-shadow(0 0 12px rgba(232,162,58,.65))}
.nbrow{cursor:pointer}
.nbrow:hover:enabled{background:#F3F5F4 !important}
.nbrow:disabled{cursor:default;color:#142026}
.clear{cursor:pointer}
.clear:hover{color:#142026 !important}
.prow{cursor:default}

/* Small additions only: keep the supplied page typography, maps and spacing. */
.screen-tools{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap;font:13px 'Public Sans',system-ui,sans-serif}
.settings-button,.custom-loan-form input{font:inherit;border:1px solid #D9DFDD;border-radius:8px;background:#fff;color:#142026;padding:9px 12px;min-height:44px;box-sizing:border-box}
.settings-button{cursor:pointer;font-family:'Public Sans',system-ui,sans-serif;font-size:14px}
.settings-button:hover{background:#E4EEF0}
.custom-loan-form{display:flex;align-items:center;flex-wrap:wrap;gap:10px;width:100%;font:15px 'Public Sans',system-ui,sans-serif}
.custom-loan-form input{width:165px}
.empty-message:empty{display:none}.empty-message{font:15px 'Public Sans',system-ui,sans-serif;color:#56636B}

#screenSettings::backdrop{background:#14202626}.settings-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.settings-heading h2{font:500 25px 'Newsreader',Georgia,serif;margin:0}

#screenSettings p{font-size:12px;color:#56636B}.download-section{border-top:1px solid #D9DFDD;margin-top:24px;padding-top:14px}
@media(max-width:600px){.screen-tools{width:100%;justify-content:flex-end}.custom-loan-form input{max-width:48vw}}


.view-status{font:13px 'Public Sans',system-ui,sans-serif;color:#56636B;text-align:right}
.about-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;font:14px 'Public Sans',system-ui,sans-serif;color:#2F6E80;background:none;border:0;padding:0 8px;cursor:pointer;text-decoration:underline}
.county-labels{pointer-events:none;font:600 11.5px 'Public Sans',sans-serif;fill:#142026;stroke:white;stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.cty:focus-visible{outline:none;stroke:#142026;stroke-width:4px;filter:drop-shadow(0 0 3px white);opacity:1}



.reason-toggle{display:flex;flex-wrap:wrap;gap:8px}.reason-toggle [aria-pressed="true"]{background:#E4EEF0;border-color:#2F6E80}
#aboutData::backdrop{background:#14202626}
.data-badge{font:11px 'Public Sans',system-ui,sans-serif;color:#56636B;background:#E4EEF0;border-radius:5px;padding:4px 6px;white-space:nowrap}
.filter-summary{font:14px/1.6 'Public Sans',system-ui,sans-serif;color:#56636B;width:100%}
.shared-footer,.definition-footer{font:13px/1.6 'Public Sans',system-ui,sans-serif;color:#56636B;margin:0;width:100%}
#screenSettings,#aboutData,#filterDialog{position:fixed;inset:16px 16px auto auto;margin:0;width:380px;max-width:calc(100vw - 32px);max-height:calc(100dvh - 32px);overflow:auto;box-sizing:border-box;padding:24px;border:1px solid #D9DFDD;border-radius:14px;background:#fff;color:#142026;box-shadow:0 16px 60px #14202626;font:14px/1.6 'Public Sans',system-ui,sans-serif}
#filterDialog::backdrop{background:#14202626}#globalFilters label{display:flex;flex-direction:column;gap:6px;margin:16px 0}#globalFilters input,#globalFilters select{font:14px 'Public Sans',system-ui,sans-serif;min-height:44px;border:1px solid #D9DFDD;border-radius:8px;padding:8px 12px;box-sizing:border-box;width:100%;background:white;color:#142026}
@media(min-width:1100px) and (max-width:1399px){header>div{flex-wrap:nowrap!important;gap:6px!important;padding-left:12px!important;padding-right:12px!important}header>div>a{flex:0 1 150px}header nav{flex-wrap:nowrap!important;gap:0!important}header .tab{padding-left:5px;padding-right:5px}header .screen-tools{flex-wrap:nowrap;gap:5px}header .settings-button{padding-left:7px;padding-right:7px}header .about-link{padding:0 3px}header .view-status{max-width:55px}header .data-badge{white-space:normal;max-width:75px}}

</style>
</head>
<body>
<div id="app"></div>
<dialog id="screenSettings" aria-labelledby="screenSettingsTitle"><div class="settings-heading"><h2 id="screenSettingsTitle">Download data</h2><button class="settings-button" data-close-dialog="screenSettings" aria-label="Close downloads">✕</button></div><section class="download-section"><p>Download this page’s figures and active conditions.</p><button class="settings-button" data-download="json">JSON</button> <button class="settings-button" data-download="csv">CSV</button><p id="downloadStatus" role="status"></p></section></dialog>
<dialog id="filterDialog" aria-labelledby="filterTitle"><div class="settings-heading"><h2 id="filterTitle">Data settings</h2><button class="settings-button" data-close-dialog="filterDialog" aria-label="Close filters">✕</button></div><form id="globalFilters"></form></dialog><dialog id="aboutData" aria-labelledby="aboutDataTitle"><div class="settings-heading"><h2 id="aboutDataTitle">About this data</h2><button class="settings-button" data-close-dialog="aboutData" aria-label="Close about this data">✕</button></div><p id="aboutSource"></p><p id="aboutDefinition"></p></dialog>
<template id="tpl-start" data-title="Start"><div style="background: #F3F5F4; color: #142026; font-family: 'Public Sans', system-ui, sans-serif"><header style="background: #FFFFFF; border-bottom: 1px solid #D9DFDD"><div style="max-width: 1200px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px"><a href="#start" style="font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 600; text-decoration: none; color: #142026; min-height: 44px; display: inline-flex; align-items: center">Mortgage Market Explorer</a><nav aria-label="Investigations" style="display: flex; flex-wrap: wrap; gap: 2px; flex: 1 1 auto"><a href="#loan" class="tab">A loan like mine</a><a href="#map" class="tab">Market vs. its neighbors</a><a href="#changes" class="tab">What changed?</a><a href="#denials" class="tab">Denial patterns</a></nav><div class="screen-tools"><span class="view-status">Guest</span><span class="data-badge">{{dataBadge}}</span><button type="button" class="settings-button" data-screen-action="filters">Filters</button><button type="button" class="settings-button" data-screen-action="download">Download</button><a class="about-link" href="#about-data" data-screen-action="about">About data</a></div></div></header><main style="max-width: 1200px; margin: 0 auto; padding: 56px 24px 64px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px; align-items: center"><div class="filter-summary">{{filterSummary}}</div><div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 32px"><div style="display: flex; flex-direction: column; gap: 16px"><h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 52px; line-height: 1.08; font-weight: 500; letter-spacing: -0.5px; max-width: 640px">What do you want to know about home loans in New Jersey?</h1><p style="margin: 0; font-size: 18px; line-height: 1.55; color: #56636B; max-width: 560px">Explore how loan sizes, denials and lending change county by county in New Jersey.</p></div><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px"><a href="#loan" class="pick" style="display: flex; flex-direction: column; gap: 10px; padding: 24px; background: #FFFFFF; border: 1px solid #D9DFDD; border-radius: 12px"><span style="font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #56636B">For homebuyers</span><span style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; font-weight: 500">I'm buying a home</span><span style="font-size: 16px; line-height: 1.5; color: #56636B">Tell us roughly how much you want to borrow. See where loans that size get made, and who makes them.</span><span style="margin-top: 6px; font-size: 15px; font-weight: 600; color: #2F6E80">Start with your loan amount</span></a><div style="display: flex; flex-direction: column; gap: 10px; padding: 24px; background: #FFFFFF; border: 1px solid #D9DFDD; border-radius: 12px"><span style="font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #56636B">For researchers</span><span style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; font-weight: 500">I study the market</span><div style="display: flex; flex-direction: column; margin-top: 2px"><a href="#map" class="go" style="font-size: 16px; font-weight: 500; color: #2F6E80; min-height: 44px; display: flex; align-items: center; border-bottom: 1px solid #ECEFEE">How does each county compare with its neighbors?</a><a href="#changes" class="go" style="font-size: 16px; font-weight: 500; color: #2F6E80; min-height: 44px; display: flex; align-items: center; border-bottom: 1px solid #ECEFEE">What changed from {{firstYear}} to {{lastYear}}?</a><a href="#denials" class="go" style="font-size: 16px; font-weight: 500; color: #2F6E80; min-height: 44px; display: flex; align-items: center">Where are loans turned down most?</a></div></div></div><p style="font-size:13px;color:#56636B;margin:0">{{startDataNote}}</p></div><div style="flex: 1 1 300px; min-width: 0; display: flex; justify-content: center"><svg viewBox="0 0 420 776" aria-hidden="true" style="width: 100%; max-width: 330px; height: auto; display: block; background: #DCE7EC; border-radius: 16px"><path fill="#E9ECEA" d="{{geo.g0}}"></path><path fill="#E9ECEA" d="{{geo.g1}}"></path><path fill="#E9ECEA" d="{{geo.g2}}"></path><g fill="#BCD6DC" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"><path d="{{geo.g3}}"></path><path d="{{geo.g4}}"></path><path d="{{geo.g5}}"></path><path d="{{geo.g6}}"></path><path d="{{geo.g7}}"></path><path d="{{geo.g8}}"></path><path d="{{geo.g9}}"></path><path d="{{geo.g10}}"></path><path d="{{geo.g11}}"></path><path d="{{geo.g12}}"></path><path d="{{geo.g13}}"></path><path d="{{geo.g14}}"></path><path d="{{geo.g15}}"></path><path d="{{geo.g16}}"></path><path d="{{geo.g17}}"></path><path d="{{geo.g18}}"></path><path d="{{geo.g19}}"></path><path d="{{geo.g20}}"></path><path d="{{geo.g21}}"></path><path d="{{geo.g22}}"></path><path d="{{geo.g23}}"></path></g><path fill="none" stroke="#2F6E80" stroke-width="1.4" stroke-linejoin="round" d="{{geo.g24}}"></path><g fill="#142026" font-family="Public Sans, sans-serif" font-size="13" font-weight="600" stroke="#FFFFFF" stroke-width="3" paint-order="stroke" stroke-linejoin="round"><circle cx="342" cy="205" r="3.5"></circle><text x="300" y="196" text-anchor="end">Newark</text><circle cx="204" cy="364" r="3.5"></circle><text x="196" y="368" text-anchor="end">Trenton</text><circle cx="284" cy="628" r="3.5"></circle><text x="292" y="640">Atlantic City</text></g><g fill="#56636B" font-family="Public Sans, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5"><text x="22" y="330">PENNSYLVANIA</text><text x="268" y="36">NEW YORK</text></g><text x="318" y="700" fill="#56636B" font-family="Newsreader, Georgia, serif" font-size="14" font-style="italic">Atlantic Ocean</text></svg></div><p class="shared-footer">{{sourceNote}} {{asOf}}</p><p class="definition-footer">{{denialDefinition}}</p></main></div></template><template id="tpl-loan" data-title="A loan like mine"><div style="background: #F3F5F4; color: #142026; font-family: 'Public Sans', system-ui, sans-serif"><header style="background: #FFFFFF; border-bottom: 1px solid #D9DFDD"><div style="max-width: 1200px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px"><a href="#start" style="font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 600; text-decoration: none; color: #142026; min-height: 44px; display: inline-flex; align-items: center">Mortgage Market Explorer</a><nav aria-label="Investigations" style="display: flex; flex-wrap: wrap; gap: 2px; flex: 1 1 auto"><a href="#loan" class="tab" aria-current="page" style="color: #142026; background: #E4EEF0">A loan like mine</a><a href="#map" class="tab">Market vs. its neighbors</a><a href="#changes" class="tab">What changed?</a><a href="#denials" class="tab">Denial patterns</a></nav><div class="screen-tools"><span class="view-status">Homebuyer view</span><span class="data-badge">{{dataBadge}}</span><button type="button" class="settings-button" data-screen-action="filters">Filters</button><button type="button" class="settings-button" data-screen-action="download">Download</button><a class="about-link" href="#about-data" data-screen-action="about">About data</a></div></div></header><main style="max-width: 1200px; margin: 0 auto; padding: 48px 24px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px"><div class="filter-summary">{{filterSummary}}</div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; font-family: 'Newsreader', Georgia, serif; font-size: 34px; line-height: 1.25"><span>I want to borrow about</span><div role="group" aria-label="Loan amount" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{amounts}}" as="a" hint-placeholder-count="3"><button type="button" class="chip" onClick="{{a.pick}}" aria-pressed="{{a.on}}" style="font-family: 'Public Sans', system-ui, sans-serif; font-size: 20px; font-weight: 600; min-height: 48px; padding: 8px 20px; border-radius: 999px; border: 1.5px solid {{a.bd}}; background: {{a.bg}}; color: {{a.fg}}">{{a.label}}</button></sc-for><button type="button" class="chip" data-screen-action="other" aria-pressed="{{custom}}" style="font-family: 'Public Sans', system-ui, sans-serif; font-size:20px; font-weight:600; min-height:48px; padding:8px 20px; border-radius:999px; border:1.5px solid #B8C3C1; background:{{otherBg}};color:{{otherFg}}">Other</button></div><span>for {{purposeLower}}.</span><sc-if value="{{custom}}"><form id="customLoanForm" class="custom-loan-form"><label for="customLoanAmount">Loan amount ($)</label><input id="customLoanAmount" type="number" min="1000" max="10000000" step="1" value="{{customAmount}}" required><button type="submit" class="settings-button">Apply</button></form></sc-if></div><sc-if value="{{noResults}}"><p class="empty-message">{{emptyMessage}}</p></sc-if><sc-if value="{{hasResults}}"><div style="display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start"><div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 40px"><section style="display: flex; flex-direction: column; gap: 10px"><p style="margin: 0; font-size: 15px; font-weight: 600; color: #56636B">Most loans this size were made in</p><p style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 64px; line-height: 1; font-weight: 500; letter-spacing: -0.5px">{{topLabel}}</p><p style="margin: 6px 0 0; font-size: 18px; line-height: 1.55; color: #33424A; max-width: 620px">{{answer}}</p></section><section aria-labelledby="where-h" style="display: flex; flex-direction: column; gap: 14px"><h2 id="where-h" style="margin: 0; font-size: 15px; font-weight: 600; color: #56636B">Where loans this size were made in {{year}}</h2><p class="empty-message">{{emptyMessage}}</p><ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px"><sc-for list="{{rows}}" as="r" hint-placeholder-count="5"><li style="display: grid; grid-template-columns: 28px minmax(110px, 160px) minmax(0, 1fr) 72px; align-items: center; gap: 12px"><span style="width: 26px; height: 26px; border-radius: 50%; background: {{r.dot}}; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{r.rank}}</span><span style="font-size: 16px; font-weight: 600">{{r.name}}</span><span style="height: 12px; background: #E1E8E8; border-radius: 6px; overflow: hidden; display: block"><span style="display: block; height: 12px; width: {{r.w}}%; background: {{r.dot}}; border-radius: 6px"></span></span><span style="font-size: 15px; font-variant-numeric: tabular-nums; text-align: right">{{r.loans}}</span></li></sc-for></ol><p style="margin: 0; font-size: 14px; color: #56636B">Number of {{purposeLower}} loans within {{tolerance}}% of {{amountLabel}}.</p></section><sc-if value="{{hasResults}}"><section aria-labelledby="who-h" style="display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #FFFFFF; border: 1px solid #D9DFDD; border-radius: 12px"><h2 id="who-h" style="margin: 0; font-size: 15px; font-weight: 600; color: #56636B">Who made the most of them in {{top.name}}</h2><div style="display: flex; flex-direction: column"><sc-for list="{{lenders}}" as="l" hint-placeholder-count="3"><div style="display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid #ECEFEE; font-size: 17px"><span style="font-weight: 600">{{l.name}}</span><span style="color: #56636B; font-variant-numeric: tabular-nums">{{l.loans}} loans</span></div></sc-for></div><p style="margin: 0; font-size: 14px; color: #56636B">{{lenderMessage}} This shows who lent the most, not who gives the best deal.</p></section></sc-if></div> SCREENS.map = (function () {

function trendChart(series,keys,colors){const max=Math.max(1,...series.flatMap(r=>keys.map(k=>r[k]||0))),width=480/series.length;return `<svg viewBox="0 0 480 160" role="img" aria-label="${escapeText(keys.join(' and '))} by year" style="width:100%;height:auto;display:block">${series.map((r,i)=>`${keys.map((key,j)=>{const h=90*(r[key]||0)/max,x=i*width+12+j*(width-24)/keys.length;return `<rect x="${x}" y="${118-h}" width="${(width-28)/keys.length}" height="${h}" fill="${colors[j]}" ${r.year===activeFilters.year?'stroke="#142026" stroke-width="2"':''}></rect><text x="${x}" y="${112-h}" font-size="11" fill="#142026">${formatNum(r[key])}</text>`;}).join('')}<text x="${i*width+width/2}" y="145" text-anchor="middle" font-size="13" fill="#56636B">${r.year}</text>`).join('')}</svg>`;}
function dotChart(rows){const good=rows.filter(r=>Number.isFinite(r.change)),min=Math.min(0,...good.map(r=>r.change)),max=Math.max(1,...good.map(r=>r.change)),placed=[];
 const dots=good.map(r=>{const x=30+420*(r.change-min)/(max-min),y=Array.from({length:good.length+1},(_,i)=>65+18*i).find(y=>placed.every(p=>Math.hypot(x-p.x,y-p.y)>=17));placed.push({x,y});return {r,x,y};}),axis=Math.max(194,...placed.map(p=>p.y+22)),height=axis+36;
 return `<svg viewBox="0 0 480 ${height}" role="img" aria-label="County changes across the configured years; Cape May is highlighted" style="width:100%;height:auto;display:block"><line x1="30" y1="${axis}" x2="450" y2="${axis}" stroke="#D9DFDD"></line>${dots.map(({r,x,y})=>`<circle cx="${x}" cy="${y}" r="7" fill="${r.name==='Cape May'?'#E8A23A':'#5B95A5'}" stroke="${r.name==='Cape May'?'#142026':'white'}"><title>${r.name}: ${formatPct(r.change)}</title></circle>${r.name==='Cape May'?`<text x="${x}" y="${y-13}" text-anchor="middle" font-size="13" fill="#142026">Cape May</text>`:''}`).join('')}<text x="30" y="${axis+22}" font-size="13">${formatPct(min)}</text><text x="450" y="${axis+22}" text-anchor="end" font-size="13">${formatPct(max)}</text></svg>`;
